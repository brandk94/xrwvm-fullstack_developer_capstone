<html>

<head>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/bootstrap.min.css">
</head>

<body>
  <div>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-light" style="background-color:darkturquoise; height: 1in;">
      <div class="container-fluid">
        <h2 style="padding-right: 5%;">Dealerships</h2>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
          aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarText">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" style="font-size: larger;" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" style="font-size: larger;" href="/about">About Us</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" style="font-size: larger;" href="/contact">Contact Us</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- Contact Form Container -->
    <div class="container my-5">
      <div class="card shadow-lg p-4" style="max-width: 800px; margin: auto; border-radius: 12px; border: none;">
        <div class="text-center mb-4">
          <h1 class="fw-bold">Contact Us</h1>
          <img src="/static/cars_highres.png" class="card-img-top" alt="Dealership Cars"
            style="width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover;" />
          <p class="text-muted">Have questions about buying a vehicle or booking service? Send us a message and our
            dealership team will get back to you shortly.</p>
        </div>

        <form action="/contact" method="POST">
          <!-- Required Name Fields -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="FirstName" class="form-label fw-semibold">First Name <span
                  class="text-danger">*</span></label>
              <input type="text" class="form-control" id="FirstName" name="FirstName" placeholder="Enter first name"
                required />
            </div>
            <div class="col-md-6">
              <label for="LastName" class="form-label fw-semibold">Last Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="LastName" name="LastName" placeholder="Enter last name"
                required />
            </div>
          </div>

          <!-- Email (Required) & Phone (Optional) -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="Email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="Email" name="Email" placeholder="name@example.com"
                required />
            </div>
            <div class="col-md-6">
              <label for="PhoneNumber" class="form-label fw-semibold">Phone Number <span
                  class="text-muted fw-normal">(Optional)</span></label>
              <input type="tel" class="form-control" id="PhoneNumber" name="PhoneNumber" placeholder="(555) 000-0000" />
            </div>
          </div>

          <!-- Optional Dealership Fields -->
          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label for="Department" class="form-label fw-semibold">Department <span
                  class="text-muted fw-normal">(Optional)</span></label>
              <select class="form-select" id="Department" name="Department">
                <option value="" selected>Select Department...</option>
                <option value="sales">Sales & Test Drives</option>
                <option value="service">Service & Maintenance</option>
                <option value="finance">Financing & Leasing</option>
                <option value="parts">Parts & Accessories</option>
              </select>
            </div>
            <div class="col-md-6">
              <label for="VehicleInterest" class="form-label fw-semibold">Vehicle / Stock # <span
                  class="text-muted fw-normal">(Optional)</span></label>
              <input type="text" class="form-control" id="VehicleInterest" name="VehicleInterest"
                placeholder="e.g., 2024 SUV or Stock #1234" />
            </div>
          </div>

          <!-- Required Message Field -->
          <div class="mb-3">
            <label for="YourMessage" class="form-label fw-semibold">Your Message <span
                class="text-danger">*</span></label>
            <textarea class="form-control" id="YourMessage" name="YourMessage" rows="4" maxlength="500"
              placeholder="Write your inquiry here..." required></textarea>
            <div class="d-flex justify-content-end mt-1">
              <small class="text-muted">Characters remaining: <span id="RemainingCount"
                  class="fw-bold">500</span></small>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="d-grid gap-2 col-md-6 mx-auto mt-4">
            <button type="submit" class="btn text-white fw-bold py-2 fs-5"
              style="background-color: darkturquoise; border: none;">Send Message</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const yourMessage = document.getElementById("YourMessage");
      const remainingCount = document.getElementById("RemainingCount");
      const maxLength = 500;

      yourMessage.addEventListener('input', function () {
        const currentLength = yourMessage.value.length;
        const remaining = maxLength - currentLength;
        remainingCount.textContent = remaining;
      });
    </script>
  </div>
</body>

</html>
